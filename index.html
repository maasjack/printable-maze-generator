<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="迷宫小探险：儿童友好的离线 A4 随机迷宫生成器，黑白打印，双击即可使用。">
  <title>迷宫小探险 · A4 迷宫生成器</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-rounded, "SF Pro Rounded", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: #192c48;
      background: #edf3fc;
      font-synthesis: none;
      --ink: #192c48;
      --blue: #2859c5;
      --muted: #526581;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { padding: 28px clamp(16px, 4vw, 56px) 36px; }
    button, input, select { font: inherit; }
    button, select, input { touch-action: manipulation; }
    .app { max-width: 1240px; margin: 0 auto; }
    .masthead { display: flex; gap: 20px; justify-content: space-between; align-items: center; margin-bottom: 26px; }
    .brand { display: flex; gap: 14px; align-items: center; }
    .brand-mark { width: 50px; height: 50px; color: var(--blue); flex-shrink: 0; }
    h1 { margin: 0; font-size: clamp(1.6rem, 3vw, 2rem); font-weight: 850; letter-spacing: .03em; }
    .tagline { margin: 4px 0 0; font-size: .9rem; color: var(--muted); }
    .edition { font-size: .875rem; font-weight: 700; border: 1px solid #b7c6df; padding: 8px 14px; border-radius: 99px; white-space: nowrap; }
    .workspace { display: grid; grid-template-columns: 282px minmax(0, 1fr); gap: 28px; align-items: start; }
    .controls { border: 2px solid var(--ink); border-radius: 22px; background: #fff; padding: 24px 20px; min-width: 0; }
    .panel-heading { display: flex; align-items: center; gap: 10px; margin: 0 0 26px; font-size: 1.2rem; }
    .panel-heading span { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #ffd75b; font-size: 1rem; }
    .field { display: grid; gap: 10px; min-width: 0; margin-bottom: 24px; }
    .field > label, legend { font-size: 1rem; font-weight: 750; }
    .step-number { color: var(--blue); font-size: .875rem; margin-right: 8px; font-variant-numeric: tabular-nums; }
    select, input { width: 100%; min-height: 48px; border: 1.5px solid #a7b6cc; border-radius: 12px; color: var(--ink); background: #f8faff; padding: 10px 12px; }
    select { cursor: pointer; }
    .custom-size { display: none; align-items: center; gap: 10px; margin-top: -10px; }
    .custom-size.visible { display: flex; }
    .custom-size .field { flex: 1; }
    .custom-size label { font-size: .875rem; color: var(--muted); }
    .custom-size input { min-width: 0; }
    fieldset { min-width: 0; margin: 0 0 24px; padding: 0; border: 0; }
    legend { padding: 0; margin-bottom: 10px; }
    .difficulty-options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .difficulty-choice { position: relative; cursor: pointer; }
    .difficulty-choice input { position: absolute; width: 1px; height: 1px; min-height: 0; margin: 0; opacity: 0; }
    .difficulty-choice span { display: block; text-align: center; padding: 13px 0; border: 1.5px solid #b9c6d9; border-radius: 12px; font-weight: 650; font-size: .95rem; }
    .difficulty-choice input:checked + span { color: #fff; background: var(--blue); border-color: var(--blue); }
    .difficulty-choice input:focus-visible + span { outline: 3px solid var(--ink); outline-offset: 3px; }
    .field-note { font-size: .875rem; line-height: 1.6; color: var(--muted); margin: 10px 0 0; min-height: 2.8em; }
    #generateButton { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 56px; border: 2px solid var(--ink); border-radius: 14px; background: #ffd75b; color: var(--ink); font-weight: 800; cursor: pointer; }
    #generateButton:hover { background: #ffe487; }
    #generateButton:active { background: #efc243; }
    #generateButton:disabled { opacity: .65; cursor: wait; }
    .refresh-icon { width: 21px; height: 21px; flex-shrink: 0; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; }
    .print-tip { border-top: 1px dashed #bdcadd; margin: 24px 0 0; padding-top: 20px; color: var(--muted); font-size: .875rem; line-height: 1.8; }
    .print-tip strong { display: block; color: var(--ink); font-size: .95rem; margin-bottom: 6px; }
    kbd { font-family: inherit; font-size: .85em; border: 1px solid #b3c1d4; border-radius: 5px; background: #f8faff; padding: 2px 5px; white-space: nowrap; }
    .status { font-size: .875rem; line-height: 1.6; color: #844100; margin: 12px 0 0; }
    .status:empty { display: none; }
    .preview { min-width: 0; }
    .preview-heading { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin: 0 4px 12px; }
    .preview-heading h2 { margin: 0; font-size: 1rem; font-weight: 750; }
    #mazeSummary { font-size: .875rem; color: var(--muted); text-align: right; }
    .paper { background: #fff; border: 1px solid #bdcbdc; border-radius: 5px; padding: clamp(12px, 2vw, 26px); border-bottom: 5px solid #c1cee0; }
    .paper-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #dbe2eb; padding: 0 0 14px; font-size: .875rem; color: var(--muted); }
    .paper-header strong { color: var(--ink); font-size: 1rem; }
    .maze-stage { --screen-ratio: 1; display: flex; justify-content: center; align-items: center; min-width: 0; width: 100%; padding: 16px 0; background: #fff; }
    #mazeSvg { display: block; width: min(100%, calc(68vh * var(--screen-ratio))); height: auto; aspect-ratio: var(--screen-ratio); background: #fff; overflow: hidden; }
    .wall { fill: none; stroke: #000; stroke-width: 1.6; stroke-linecap: square; vector-effect: non-scaling-stroke; }
    .direction-arrow { fill: none; stroke: #000; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .paper-footer { text-align: center; font-size: .875rem; color: var(--muted); margin: 0; padding-top: 8px; }
    .preview-footnote { margin: 12px 4px 0; color: var(--muted); font-size: .875rem; line-height: 1.6; }
    @media (max-width: 860px) {
      .workspace { grid-template-columns: 1fr; gap: 22px; }
      .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; }
      .panel-heading, .print-tip, .status { grid-column: 1 / -1; }
      .panel-heading, .field, fieldset { margin: 0; }
      .custom-size { margin: 0; }
      .custom-size.visible { grid-column: 1 / -1; grid-row: 3; }
      #generateButton { grid-column: 1 / -1; }
      .print-tip { margin: 0; padding-top: 12px; }
      .print-tip strong { display: inline; margin-right: 8px; }
      .field-note { min-height: 0; }
    }
    @media (max-width: 480px) {
      body { padding: 18px 12px 28px; }
      .masthead { margin-bottom: 20px; gap: 8px; }
      .brand { gap: 10px; }
      .brand-mark { width: 38px; height: 38px; }
      .edition { display: none; }
      .controls { grid-template-columns: 1fr; gap: 18px; border-radius: 18px; padding: 18px; }
      .custom-size.visible { grid-row: auto; }
      .preview-heading { flex-wrap: wrap; }
      .paper-header { font-size: .875rem; }
    }
    /* A4 可打印区域为 190×277mm；保留 1mm 排版余量，避免取整引发空白第二页。
       根元素不能再设为整张纸尺寸，否则与 @page 边距叠加。 */
    @page { size: A4 portrait; margin: 10mm; }
    @media print {
      html, body { width: auto; height: auto; min-height: 0; margin: 0; padding: 0; background: #fff; }
      .masthead, .controls, .preview-heading, .paper-header, .paper-footer, .preview-footnote { display: none !important; }
      .app, .workspace, .preview, .paper { display: block; width: 190mm; margin: 0; padding: 0; border: 0; border-radius: 0; background: #fff; }
      .maze-stage { display: flex; width: 190mm; height: 276mm; min-height: 0; margin: 0; padding: 0; break-inside: avoid; page-break-inside: avoid; }
      #mazeSvg { width: var(--print-width); height: var(--print-height); max-width: 190mm; max-height: 276mm; aspect-ratio: auto; }
      /* 物理线宽不随格子数变细，50×50 仍可黑白打印；箭头比墙体更醒目。 */
      .wall { stroke: #000; stroke-width: .38mm; }
      .direction-arrow { stroke: #000; stroke-width: .6mm; }
    }
  </style>
</head>
<body>

  <main class="app">
    <header class="masthead">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 5H5v38h38V5H29M5 17h14v13h12V17h12M16 43V30M31 43v-6M19 17V5"/>
        </svg>
        <div><h1>迷宫小探险</h1><p class="tagline">一张纸，一支笔，出发吧。</p></div>
      </div>
      <span class="edition">A4 迷宫生成器 · 2.0</span>
    </header>
    <div class="workspace">
      <section class="controls" aria-label="迷宫设置">
        <h2 class="panel-heading"><span aria-hidden="true">＋</span>准备出发</h2>
        <div class="field">
          <label for="sizeSelect"><span class="step-number" aria-hidden="true">01</span>选一张地图</label>
          <select id="sizeSelect" aria-label="迷宫大小">
            <option value="10x10">小 · 10 × 10</option>
            <option value="15x15">较小 · 15 × 15</option>
            <option value="20x20" selected>中等 · 20 × 20</option>
            <option value="25x25">较大 · 25 × 25</option>
            <option value="30x30">大 · 30 × 30</option>
            <option value="custom">自定义大小</option>
          </select>
        </div>
        <div id="customSize" class="custom-size" aria-label="自定义尺寸">
          <div class="field"><label for="customWidth">宽度</label><input id="customWidth" type="number" min="5" max="50" step="1" value="20" inputmode="numeric" aria-describedby="status"></div>
          <span aria-hidden="true">×</span>
          <div class="field"><label for="customHeight">高度</label><input id="customHeight" type="number" min="5" max="50" step="1" value="20" inputmode="numeric" aria-describedby="status"></div>
        </div>
        <fieldset aria-describedby="difficultyNote">
          <legend><span class="step-number" aria-hidden="true">02</span>选一点挑战</legend>
          <div class="difficulty-options">
            <label class="difficulty-choice"><input type="radio" name="difficulty" value="easy"><span>简单</span></label>
            <label class="difficulty-choice"><input type="radio" name="difficulty" value="normal" checked><span>普通</span></label>
            <label class="difficulty-choice"><input type="radio" name="difficulty" value="hard"><span>困难</span></label>
          </div>
          <p id="difficultyNote" class="field-note">多绕几个弯，试试你的方向感。</p>
        </fieldset>
        <button id="generateButton" type="button">
          <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M5 8a8 8 0 0 1 13-2l2 3M4 15l2 3a8 8 0 0 0 13-2"/></svg>
          生成新迷宫
        </button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <p class="print-tip"><strong>拿起笔，在纸上探险</strong>按 <kbd>Ctrl + P</kbd> 打印，Mac 用 <kbd>⌘ + P</kbd>。选择 A4 纵向，关闭页眉和页脚。</p>
      </section>
      <section class="preview" aria-label="迷宫预览">
        <div class="preview-heading"><h2>你的探险地图</h2><span id="mazeSummary" aria-live="polite">20 × 20 · 普通</span></div>
        <div class="paper">
          <div class="paper-header"><strong>从箭头出发</strong><span>找到另一边的出口</span></div>
          <div id="mazeStage" class="maze-stage">
            <svg id="mazeSvg" role="img" aria-label="随机生成的迷宫"></svg>
          </div>
          <p class="paper-footer">慢慢来，每一个转弯都值得探索。</p>
        </div>
        <p id="printNote" class="preview-footnote">打印时只保留迷宫和箭头，不会打印彩色界面。</p>
      </section>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const N = 1;
      const E = 2;
      const S = 4;
      const W = 8;
      const ALL_WALLS = N | E | S | W;
      const DIRECTIONS = [
        { bit: N, opposite: S, dx: 0, dy: -1 },
        { bit: E, opposite: W, dx: 1, dy: 0 },
        { bit: S, opposite: N, dx: 0, dy: 1 },
        { bit: W, opposite: E, dx: -1, dy: 0 }
      ];
      const SVG_NS = "http://www.w3.org/2000/svg";

      const sizeSelect = document.querySelector("#sizeSelect");
      const difficultyInputs = document.querySelectorAll('input[name="difficulty"]');
      const getDifficulty = () => document.querySelector('input[name="difficulty"]:checked').value;
      const difficultyLabels = { easy: "简单", normal: "普通", hard: "困难" };
      const customSize = document.querySelector("#customSize");
      const customWidth = document.querySelector("#customWidth");
      const customHeight = document.querySelector("#customHeight");
      const generateButton = document.querySelector("#generateButton");
      const status = document.querySelector("#status");
      const mazeStage = document.querySelector("#mazeStage");
      const mazeSvg = document.querySelector("#mazeSvg");

      const randomInt = max => Math.floor(Math.random() * max);
      const cellIndex = (x, y, width) => y * width + x;

      function clampDimension(input) {
        const original = input.value.trim() === "" ? NaN : Number(input.value);
        const safe = Number.isFinite(original) ? Math.round(original) : 20;
        const clamped = Math.min(50, Math.max(5, safe));
        input.value = String(clamped);
        return { value: clamped, changed: original !== clamped };
      }

      function getDimensions() {
        if (sizeSelect.value !== "custom") {
          const [width, height] = sizeSelect.value.split("x").map(Number);
          return { width, height };
        }

        const width = clampDimension(customWidth);
        const height = clampDimension(customHeight);
        status.textContent = width.changed || height.changed
          ? "自定义尺寸已限制在 5 × 5 至 50 × 50 之间。"
          : "";
        return { width: width.value, height: height.value };
      }

      function boundaryCells(width, height) {
        const cells = [];
        for (let x = 0; x < width; x += 1) {
          cells.push({ x, y: 0, side: "top" });
          if (height > 1) cells.push({ x, y: height - 1, side: "bottom" });
        }
        for (let y = 1; y < height - 1; y += 1) {
          cells.push({ x: 0, y, side: "left" });
          if (width > 1) cells.push({ x: width - 1, y, side: "right" });
        }
        return cells;
      }

      /*
       * Growing Tree 算法生成完美迷宫：每次只连接一个未访问格子，
       * 因此所有格子连通且任意两格之间只有一条通路。
       * newestBias 越高越接近深度优先，straightBias 控制长走廊倾向。
       */
      function generatePerfectMaze(width, height, newestBias, straightBias) {
        const cells = new Uint8Array(width * height);
        cells.fill(ALL_WALLS);
        const visited = new Uint8Array(width * height);
        const start = randomInt(cells.length);
        visited[start] = 1;
        const active = [{ index: start, lastBit: 0 }];

        while (active.length) {
          const activePosition = Math.random() < newestBias
            ? active.length - 1
            : randomInt(active.length);
          const current = active[activePosition];
          const x = current.index % width;
          const y = Math.floor(current.index / width);
          const available = [];

          for (const direction of DIRECTIONS) {
            const nx = x + direction.dx;
            const ny = y + direction.dy;
            if (nx < 0 || ny < 0 || nx >= width || ny >= height) continue;
            const nextIndex = cellIndex(nx, ny, width);
            if (!visited[nextIndex]) available.push({ ...direction, nextIndex });
          }

          if (!available.length) {
            active.splice(activePosition, 1);
            continue;
          }

          let direction;
          const straight = available.find(candidate => candidate.bit === current.lastBit);
          if (straight && Math.random() < straightBias) {
            direction = straight;
          } else {
            direction = available[randomInt(available.length)];
          }

          cells[current.index] &= ~direction.bit;
          cells[direction.nextIndex] &= ~direction.opposite;
          visited[direction.nextIndex] = 1;
          active.push({ index: direction.nextIndex, lastBit: direction.bit });
        }

        return cells;
      }

      function openNeighbors(index, cells, width, height) {
        const x = index % width;
        const y = Math.floor(index / width);
        const result = [];
        for (const direction of DIRECTIONS) {
          if (cells[index] & direction.bit) continue;
          const nx = x + direction.dx;
          const ny = y + direction.dy;
          if (nx >= 0 && ny >= 0 && nx < width && ny < height) {
            result.push(cellIndex(nx, ny, width));
          }
        }
        return result;
      }

      function distancesFrom(start, cells, width, height) {
        const distance = new Int32Array(cells.length);
        const parent = new Int32Array(cells.length);
        distance.fill(-1);
        parent.fill(-1);
        const queue = new Int32Array(cells.length);
        let head = 0;
        let tail = 0;
        queue[tail++] = start;
        distance[start] = 0;

        while (head < tail) {
          const current = queue[head++];
          for (const next of openNeighbors(current, cells, width, height)) {
            if (distance[next] !== -1) continue;
            distance[next] = distance[current] + 1;
            parent[next] = current;
            queue[tail++] = next;
          }
        }
        return { distance, parent };
      }

      function chooseOpeningPair(cells, width, height, difficulty) {
        const boundary = boundaryCells(width, height);
        const entrance = boundary[randomInt(boundary.length)];
        const entranceIndex = cellIndex(entrance.x, entrance.y, width);
        const traversal = distancesFrom(entranceIndex, cells, width, height);
        const ranked = boundary
          .filter(cell => cell.x !== entrance.x || cell.y !== entrance.y)
          .map(cell => ({
            ...cell,
            distance: traversal.distance[cellIndex(cell.x, cell.y, width)]
          }))
          .sort((a, b) => a.distance - b.distance);

        const minimumDistance = Math.max(4, Math.floor((width + height) * 0.55));
        const distant = ranked.filter(cell => cell.distance >= minimumDistance);
        const pool = distant.length ? distant : ranked.slice(-1);
        const bands = {
          easy: [0.55, 0.76],
          normal: [0.76, 0.93],
          hard: [0.93, 1]
        };
        const [low, high] = bands[difficulty];
        const from = Math.min(pool.length - 1, Math.floor((pool.length - 1) * low));
        const to = Math.min(pool.length - 1, Math.ceil((pool.length - 1) * high));
        const exit = pool[from + randomInt(Math.max(1, to - from + 1))];
        return { entrance, exit, traversal };
      }

      function pathBetween(exitIndex, entranceIndex, parent) {
        const path = [];
        let current = exitIndex;
        while (current !== -1) {
          path.push(current);
          if (current === entranceIndex) break;
          current = parent[current];
        }
        path.reverse();
        return path;
      }

      function countTurns(path, width) {
        let turns = 0;
        for (let i = 2; i < path.length; i += 1) {
          const previousStep = path[i - 1] - path[i - 2];
          const currentStep = path[i] - path[i - 1];
          if (previousStep !== currentStep) turns += 1;
        }
        return turns;
      }

      function deepestMisleadingBranch(path, cells, width, height) {
        const onPath = new Uint8Array(cells.length);
        path.forEach(index => { onPath[index] = 1; });
        let deepest = 0;

        for (const pathCell of path) {
          for (const neighbor of openNeighbors(pathCell, cells, width, height)) {
            if (onPath[neighbor]) continue;
            const stack = [{ index: neighbor, parent: pathCell, depth: 1 }];
            while (stack.length) {
              const current = stack.pop();
              deepest = Math.max(deepest, current.depth);
              for (const next of openNeighbors(current.index, cells, width, height)) {
                if (next !== current.parent && !onPath[next]) {
                  stack.push({ index: next, parent: current.index, depth: current.depth + 1 });
                }
              }
            }
          }
        }
        return deepest;
      }

      /*
       * 难度分数侧重正确路线长度，同时参考转弯、路线上的决策点、
       * 最深误导支路和全图死胡同比例。它只用于候选间相对比较。
       */
      function scoreMaze(cells, width, height, openings) {
        const entranceIndex = cellIndex(openings.entrance.x, openings.entrance.y, width);
        const exitIndex = cellIndex(openings.exit.x, openings.exit.y, width);
        const path = pathBetween(exitIndex, entranceIndex, openings.traversal.parent);
        const turns = countTurns(path, width);
        let decisions = 0;
        let deadEnds = 0;

        for (let index = 0; index < cells.length; index += 1) {
          const degree = openNeighbors(index, cells, width, height).length;
          if (degree === 1) deadEnds += 1;
        }
        for (const index of path.slice(1, -1)) {
          if (openNeighbors(index, cells, width, height).length > 2) decisions += 1;
        }

        const misleadingDepth = deepestMisleadingBranch(path, cells, width, height);
        const pathRatio = path.length / cells.length;
        const turnDensity = turns / Math.max(1, path.length - 2);
        const decisionDensity = decisions / Math.max(1, path.length);
        const scale = Math.max(1, width + height);
        const score = pathRatio * 60
          + turnDensity * 14
          + Math.min(1.5, turns / scale) * 10
          + decisionDensity * 9
          + Math.min(1.5, misleadingDepth / scale) * 12
          + (deadEnds / cells.length) * 5;

        return { score, pathLength: path.length, turns, decisions, deadEnds, misleadingDepth };
      }

      function candidateCount(width, height) {
        const area = width * height;
        if (area <= 225) return 14;
        if (area <= 625) return 11;
        if (area <= 900) return 9;
        return 7;
      }

      function createCandidate(width, height, difficulty) {
        const profiles = {
          easy: { newest: [0.12, 0.42], straight: [0.02, 0.22] },
          normal: { newest: [0.42, 0.76], straight: [0.2, 0.56] },
          hard: { newest: [0.8, 0.99], straight: [0.52, 0.86] }
        };
        const profile = profiles[difficulty];
        const between = ([min, max]) => min + Math.random() * (max - min);
        const cells = generatePerfectMaze(
          width,
          height,
          between(profile.newest),
          between(profile.straight)
        );
        const openings = chooseOpeningPair(cells, width, height, difficulty);
        const metrics = scoreMaze(cells, width, height, openings);
        return { cells, openings, metrics };
      }

      function generateBestMaze(width, height, difficulty) {
        const candidates = [];
        const count = candidateCount(width, height);
        for (let i = 0; i < count; i += 1) {
          candidates.push(createCandidate(width, height, difficulty));
        }
        candidates.sort((a, b) => a.metrics.score - b.metrics.score);
        if (difficulty === "easy") return candidates[0];
        if (difficulty === "hard") return candidates[candidates.length - 1];
        return candidates[Math.floor(candidates.length / 2)];
      }

      function createLine(x1, y1, x2, y2, className) {
        const line = document.createElementNS(SVG_NS, "line");
        line.setAttribute("x1", x1);
        line.setAttribute("y1", y1);
        line.setAttribute("x2", x2);
        line.setAttribute("y2", y2);
        line.setAttribute("class", className);
        return line;
      }

      function removeBoundaryWall(cells, opening, width) {
        const index = cellIndex(opening.x, opening.y, width);
        const sideToBit = { top: N, right: E, bottom: S, left: W };
        cells[index] &= ~sideToBit[opening.side];
      }

      function arrowGeometry(opening, isEntrance) {
        const centers = {
          top: [opening.x + 0.5, 0],
          right: [opening.x + 1, opening.y + 0.5],
          bottom: [opening.x + 0.5, opening.y + 1],
          left: [0, opening.y + 0.5]
        };
        const outward = {
          top: [0, -1],
          right: [1, 0],
          bottom: [0, 1],
          left: [-1, 0]
        }[opening.side];
        const boundary = centers[opening.side];
        const outside = [boundary[0] + outward[0] * 1.25, boundary[1] + outward[1] * 1.25];
        return isEntrance
          ? { from: outside, to: boundary }
          : { from: boundary, to: outside };
      }

      function appendArrow(svg, opening, isEntrance) {
        const { from, to } = arrowGeometry(opening, isEntrance);
        const group = document.createElementNS(SVG_NS, "g");
        group.setAttribute("class", "direction-arrow");
        group.setAttribute("data-kind", isEntrance ? "entrance" : "exit");
        group.setAttribute("data-side", opening.side);
        group.appendChild(createLine(from[0], from[1], to[0], to[1], "direction-arrow"));

        const dx = to[0] - from[0];
        const dy = to[1] - from[1];
        const length = Math.hypot(dx, dy);
        const ux = dx / length;
        const uy = dy / length;
        const px = -uy;
        const py = ux;
        const headLength = 0.34;
        const headWidth = 0.23;
        group.appendChild(createLine(
          to[0], to[1],
          to[0] - ux * headLength + px * headWidth,
          to[1] - uy * headLength + py * headWidth,
          "direction-arrow"
        ));
        group.appendChild(createLine(
          to[0], to[1],
          to[0] - ux * headLength - px * headWidth,
          to[1] - uy * headLength - py * headWidth,
          "direction-arrow"
        ));
        svg.appendChild(group);
      }

      function renderMaze(candidate, width, height) {
        const cells = candidate.cells.slice();
        removeBoundaryWall(cells, candidate.openings.entrance, width);
        removeBoundaryWall(cells, candidate.openings.exit, width);

        mazeSvg.replaceChildren();
        mazeSvg.setAttribute("viewBox", `${-1.55} ${-1.55} ${width + 3.1} ${height + 3.1}`);
        mazeSvg.setAttribute("preserveAspectRatio", "xMidYMid meet");
        mazeSvg.setAttribute(
          "aria-label",
          `${width} 乘 ${height} 的随机迷宫，入口和出口由箭头标记`
        );

        const walls = document.createElementNS(SVG_NS, "g");
        walls.setAttribute("aria-hidden", "true");
        for (let y = 0; y < height; y += 1) {
          for (let x = 0; x < width; x += 1) {
            const wallsAtCell = cells[cellIndex(x, y, width)];
            if (wallsAtCell & N) walls.appendChild(createLine(x, y, x + 1, y, "wall"));
            if (wallsAtCell & W) walls.appendChild(createLine(x, y, x, y + 1, "wall"));
            if (y === height - 1 && (wallsAtCell & S)) {
              walls.appendChild(createLine(x, y + 1, x + 1, y + 1, "wall"));
            }
            if (x === width - 1 && (wallsAtCell & E)) {
              walls.appendChild(createLine(x + 1, y, x + 1, y + 1, "wall"));
            }
          }
        }
        mazeSvg.appendChild(walls);
        appendArrow(mazeSvg, candidate.openings.entrance, true);
        appendArrow(mazeSvg, candidate.openings.exit, false);

        const ratio = (width + 3.1) / (height + 3.1);
        mazeStage.style.setProperty("--screen-ratio", ratio.toFixed(5));
        const printWidth = Math.min(190, 276 * ratio);
        const printHeight = Math.min(276, 190 / ratio);
        mazeStage.style.setProperty("--print-width", `${printWidth.toFixed(2)}mm`);
        mazeStage.style.setProperty("--print-height", `${printHeight.toFixed(2)}mm`);
        document.querySelector("#mazeSummary").textContent =
          `${width} × ${height} · ${difficultyLabels[getDifficulty()]}`;
        const cellMillimeters = printWidth / (width + 3.1);
        document.querySelector("#printNote").textContent = cellMillimeters < 5
          ? `这张地图的通道约 ${cellMillimeters.toFixed(1)} mm 宽，适合细铅笔；想画得更轻松，可以选小一些的地图。打印只保留迷宫和箭头。`
          : "打印时只保留迷宫和箭头，不会打印彩色界面。";
      }

      function generateAndRender() {
        generateButton.disabled = true;
        if (sizeSelect.value !== "custom") status.textContent = "";
        const { width, height } = getDimensions();
        const candidate = generateBestMaze(width, height, getDifficulty());
        renderMaze(candidate, width, height);
        generateButton.disabled = false;

        /* 仅供自动测试读取，不在页面中显示，也不参与功能交互。 */
        window.__mazeTestState = {
          width,
          height,
          difficulty: getDifficulty(),
          cells: Array.from(candidate.cells),
          openings: candidate.openings,
          metrics: candidate.metrics
        };
      }

      sizeSelect.addEventListener("change", () => {
        customSize.classList.toggle("visible", sizeSelect.value === "custom");
        status.textContent = "";
      });
      generateButton.addEventListener("click", generateAndRender);
      [customWidth, customHeight].forEach(input => {
        input.addEventListener("change", () => {
          const result = clampDimension(input);
          status.textContent = result.changed ? "宽度和高度需为 5–50 的整数，已自动调整。" : "";
        });
      });

      difficultyInputs.forEach(input => {
        input.addEventListener("change", () => {
          const notes = {
            easy: "路线短一些，轻松找到小小成就感。",
            normal: "多绕几个弯，试试你的方向感。",
            hard: "路线更长，耐心探索每一个岔路。"
          };
          document.querySelector("#difficultyNote").textContent = notes[getDifficulty()];
        });
      });

      generateAndRender();
    })();
  </script>
</body>
</html>
